# Bite Cube receiver bridge for Home Assistant (ESP32).
#
# * bitekeeper starts by itself once BLE is up (auto_start: true).
# * First run: press "Scan for receivers", wait a few seconds, then
#   "Pair receiver" (the strongest one found). The pairing is stored.
# * Every bite / drop-back is a Home Assistant event entity per rod and
#   flashes the on-board LED; the number of alarms is discovered at runtime.
#
# Wi-Fi credentials: copy secrets.yaml.example to secrets.yaml.
esphome:
  name: bitekeeper-example

external_components:
  - source:
      type: local
      path: ../components
  # - source: github://kernelorg/esphome-rippton-bitekeeper@main
    components:
      - bitekeeper

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 1100ms
    window: 80ms
    continuous: false

ble_client:
  - id: cube
    mac_address: 00:00:00:00:00:00   # replaced at runtime by the stored pairing
    auto_connect: true

output:
  - platform: gpio
    id: led_out
    pin: GPIO2                       # on-board LED of most ESP32 dev boards

light:
  - platform: binary
    id: bite_led
    name: "Bite LED"
    output: led_out

bitekeeper:
  id: cube_dev
  ble_client_id: cube
  poll_interval: 15s

  # A bite on any alarm (repeats at most once per bite_repeat while the
  # line keeps running): flash the LED.
  on_bite:
    - light.turn_on: bite_led
    - delay: 3s
    - light.turn_off: bite_led

  # Only alarm 2 (e.g. the rod on the left).
  on_alarm:
    - alarm: 2
      direction: bite
      then:
        - logger.log: "Alarm 2: bite on the left rod"

  # Drop-back on alarm 1 or 3.
  on_drop:
    - alarm:
        - 1
        - 3
      then:
        - logger.log: "Drop-back on an outer rod"

  on_connect:
    - logger.log: "Cube connected"
  on_disconnect:
    - logger.log: "Cube disconnected"

  # The cube reported a different set of paired alarms.
  on_alarms_change:
    - logger.log:
        format: "Paired alarms: %u"
        args:
          - 'count'

  # The cube answered a settings command (status 0 = ok).
  on_command_ack:
    - logger.log:
        format: "Command %u: status %u"
        args:
          - 'command'
          - 'status'

# Home Assistant event entities (event types: bite, drop).
event:
  - platform: bitekeeper
    alarm: 1
    name: "Rod 1"
  - platform: bitekeeper
    alarm: 2
    name: "Rod 2"
  - platform: bitekeeper
    name: "Any rod"

sensor:
  - platform: bitekeeper
    type: receiver_voltage
    name: "Receiver battery"
  - platform: bitekeeper
    type: alarm_count
    name: "Paired alarms"
  - platform: bitekeeper
    type: alarm_voltage
    alarm: 1
    name: "Alarm 1 battery"
  - platform: bitekeeper
    type: event_count
    name: "Events since boot"
  - platform: bitekeeper
    type: rssi
    name: "Cube RSSI"

binary_sensor:
  - platform: bitekeeper
    name: "Cube connected"
  - platform: bitekeeper
    type: alarm_online
    alarm: 1
    name: "Alarm 1 online"

text_sensor:
  - platform: bitekeeper
    type: status
    name: "Cube status"
  - platform: bitekeeper
    type: paired_name
    name: "Cube name"
  # One line for however many alarms are paired:
  # "1: 3.92 V online; 3: 3.85 V offline"
  - platform: bitekeeper
    type: alarms
    name: "Alarms"
  - platform: bitekeeper
    type: last_event
    name: "Last bite"
  - platform: bitekeeper
    type: scan_results
    name: "Receivers found"

button:
  # Night mode: quiet alarm 1, louder receiver.
  - platform: template
    name: "Night mode"
    on_press:
      - bitekeeper.set_alarm:
          alarm: 1
          volume: 2
          sensitivity: 6
      - bitekeeper.set_receiver:
          volume: 8
  - platform: bitekeeper
    type: scan
    name: "Scan for receivers"
  - platform: bitekeeper
    type: pair
    name: "Pair receiver"
  - platform: bitekeeper
    type: forget
    name: "Forget receiver"

switch:
  - platform: bitekeeper
    name: "Cube link"
  - platform: bitekeeper
    type: alarm_mute
    alarm: 1
    name: "Alarm 1 mute"
  - platform: bitekeeper
    type: mute_all
    name: "Mute everything"

number:
  - platform: bitekeeper
    name: "Keep-alive interval"
    mode: box
  # Settings of alarm 1 and the receiver: show the cube's value, send a change.
  - platform: bitekeeper
    type: alarm_volume
    alarm: 1
    name: "Alarm 1 volume"
  - platform: bitekeeper
    type: alarm_sensitivity
    alarm: 1
    name: "Alarm 1 sensitivity"
  - platform: bitekeeper
    type: alarm_tone
    alarm: 1
    name: "Alarm 1 tone"
  - platform: bitekeeper
    type: receiver_volume
    name: "Receiver volume"
